[package]
name = "webmentions-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
webmentions-sdk = { path = "../../src/rust", features = ["db", "file", "axum"] }
serde_json = "1"
tempfile = "3"
chrono = "0.4"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
