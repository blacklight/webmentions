[package]
name = "webmentions-sdk"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "A general-purpose library to add Webmentions support to your website"
readme = "README.md"
homepage = "https://git.fabiomanganiello.com/webmentions"
repository = "https://github.com/blacklight/webmentions"
keywords = ["webmentions", "microformats", "indieweb", "federation"]
categories = ["web-programming"]

[features]
default = []
# SQLite-backed storage adapter (rusqlite)
db = ["dep:rusqlite"]
# Filesystem watcher/monitor for outgoing Webmentions (notify crate)
file = ["dep:notify"]
# axum web-framework adapter
axum = ["dep:axum", "dep:tower"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
url = "2"
ureq = "3"
scraper = "0.23"
microformats = { version = "0.19", default-features = false }
minijinja = "2"
percent-encoding = "2"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
notify = { version = "8", optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }

[dev-dependencies]
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
